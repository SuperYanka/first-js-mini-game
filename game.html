    <div id="man"><img src="https://cdn-icons-png.flaticon.com/512/52/52033.png" width="100"></div>  

<script>
    var l = 350;
    var t = 380;   
    
window.onkeydown =function move(){    
             if(event.keyCode==37){ 
                 l-=10;  
                document.getElementById('man').style.left = l + 'px'; 
            }
            else 
                if(event.keyCode==39){
                l+=10;
                document.getElementById('man').style.left= l + 'px';
            }  else 
                if(event.keyCode==32){
                t-=50;  
                document.getElementById('man').style.top = t + 'px';
            
                } 
                
                   if ( (t<=0)  && (l>-10) )   
                   if ( (t<=0)  && (l<999999) ) 
                  { alert('Вы смогли сбежать!!!');  
                  location.reload(true); 
                   }

                   if ( (t<=140)  && (l>0) )   
                   if ( (t<=140)  && (l<80) ) 
                    
                 { alert('Вас убили!'); 
                  location.reload(true);  }  
                
                   
                   
                if ( (t<=140)  && (l>250) )   
                   if ( (t<=140)  && (l<400) ) 
                 { alert('Вас убили!'); 
                  location.reload(true);  }  

                
                  if ( (t<=140)  && (l>500) )   
                   if ( (t<=140)  && (l<700) ) 
                 { alert('Вас убили!'); 
                  location.reload(true);  }  

                  if ( (l<=-50)  && (t>0) )   
                   if ( (l<=-50)  && (t<999999) ) 
                 { alert('Туда нельзя!'); 
                  location.reload(true);  }  
                  
                  if ( (l>=800)  && (t>0) )   
                   if ( (l>=800)  && (t<999999) ) 
                 { alert('Вы выпали с мира!'); 
                  location.reload(true);  }  
                  

                 
                   }  
</script>
